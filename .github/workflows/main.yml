name: Build OpenWrt 25.12.6 Quick Pro (ZTE E8822 / E8820V2)

on:
workflow_dispatch:
inputs:
openwrt_version:
description: 'إصدار OpenWrt المطلوب بناؤه'
required: true
default: 'v25.12.6'
type: choice
options:
- v25.12.6
- v24.10.5
- v23.05.5

jobs:
build:
runs-on: ubuntu-24.04
steps:
- name: Checkout BuildKit
uses: actions/checkout@v4

- name: Free Disk Space (+30GB)
run: |
sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/local/lib/android /opt/hostedtoolcache/CodeQL
sudo docker image prune --all --force 2>/dev/null || true
df -h

- name: Locate BuildKit root
run: |
if [ ! -d patches ]; then
SUB=SUB" ] && mv "SUB")"/* . 2>/dev/null || true
fi
ls -la

- name: Install build dependencies
run: |
sudo apt-get update
sudo apt-get install -y ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential 
 bzip2 ccache cmake cpio curl device-tree-compiler fastjar flex gawk gettext 
 git gperf haveged help2man intltool libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev 
 libmpc-dev libmpfr-dev libncurses-dev libreadline-dev libssl-dev libtool lrzsz 
 mkisofs msmtp nano ninja-build p7zip p7zip-full patch pkgconf python3 python3-pyelftools 
 libpython3-dev qemu-utils rsync scons squashfs-tools subversion swig texinfo uglifyjs upx-ucl unzip 
 vim wget xmlto xxd zlib1g-dev zstd

- name: Clone OpenWrt ({{ inputs.openwrt_version || 'v25.12.6' }}"
git clone --depth 1 --branch "$`VER" https://github.com/openwrt/openwrt.git openwrt

- name: Apply ZTE E8822 / E8820V2 DTS & Target
run: |
sh patches/apply-e8822-target.sh openwrt

- name: Update & Install Feeds
working-directory: openwrt
run: |
./scripts/feeds update -a
./scripts/feeds install -a

- name: Copy Optimized Config & Pre-baked Quick Pro ROM Files
run: |
cp config/e8822-64m-16m.config openwrt/.config
cp -a files openwrt/files
cd openwrt && make defconfig

- name: Download Sources
working-directory: openwrt
run: make download -j`$(nproc)

- name: Compile OpenWrt Firmware (.bin)
working-directory: openwrt
run: make -j$`(nproc) || make -j1 V=s

- name: Upload Ready-to-Flash Firmware (.bin)
uses: actions/upload-artifact@v4
with:
name: OpenWrt-`${{ inputs.openwrt_version || 'v25.12.6' }}-ZTE-E8822-QuickPro
path: openwrt/bin/targets/ramips/mt7621/zte_e8820v2.bin
